<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mut:#667085;--pri:#0f766e;--bd:#e2e5ea;--ok:#15803d;--mid:#b45309;--bad:#b91c1c;--warn:#fef3c7}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1316;--card:#171c21;--tx:#e8ecef;--mut:#93a0ab;--pri:#2dd4bf;--bd:#27303a;--ok:#4ade80;--mid:#fbbf24;--bad:#f87171;--warn:#3a3217}}
:root[data-theme="dark"]{--bg:#0f1316;--card:#171c21;--tx:#e8ecef;--mut:#93a0ab;--pri:#2dd4bf;--bd:#27303a;--ok:#4ade80;--mid:#fbbf24;--bad:#f87171;--warn:#3a3217}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,Segoe UI,sans-serif}
header{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
header b{margin-right:12px;color:var(--pri)}
nav button{background:none;border:0;color:var(--mut);padding:8px 12px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on{background:var(--pri);color:#fff}
main{max-width:1000px;margin:0 auto;padding:16px 16px 260px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
.b{background:var(--pri);color:#fff;border:0;padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit}
.g{background:none;border:1px solid var(--bd);color:var(--tx);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit}
.b:disabled,.g:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:90px;resize:vertical}label{display:block;margin:10px 0 4px;color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);color:var(--mut);display:inline-block}
.warn{background:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px}
.timer{font-size:48px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}.timer.low{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.item{padding:10px 0;border-bottom:1px solid var(--bd)}.item:last-child{border:0}
.seg{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.seg button{border:1px solid var(--bd);background:none;color:var(--tx);padding:5px 9px;border-radius:7px;cursor:pointer;font-size:13px}
.seg button.s2{background:var(--ok);color:#fff;border-color:var(--ok)}.seg button.s1{background:var(--mid);color:#fff;border-color:var(--mid)}.seg button.s0{background:var(--bad);color:#fff;border-color:var(--bad)}
.mut{color:var(--mut)}.small{font-size:13px}pre{white-space:pre-wrap;font:inherit;margin:0}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}.tabs button{padding:7px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);cursor:pointer;font:inherit}.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.imp img{max-width:100%;border:1px solid var(--bd);border-radius:8px;margin-top:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:760px){.two{grid-template-columns:1fr}}
#vid{position:fixed;right:12px;bottom:12px;width:230px;background:#000;border-radius:12px;overflow:hidden;z-index:9;box-shadow:0 4px 18px #0005}
#vid video{width:100%;display:block;background:#111}#vid .lv{position:absolute;right:6px;top:6px;width:70px;border-radius:6px;border:1px solid #fff5}
#vid .ctl{display:flex;gap:4px;padding:6px;background:#111;justify-content:center;color:#fff;font-size:12px}#vid button{background:#333;color:#fff;border:0;border-radius:6px;padding:4px 8px;cursor:pointer}
.hide{display:none}.crit{color:var(--bad);font-weight:600}
.timer{font-size:40px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.pane{max-height:calc(100vh - 330px);min-height:320px;overflow:auto;padding-right:4px}
.pane .card{margin-bottom:10px}
.sticky-b{position:sticky;bottom:0;padding:8px 0;background:var(--bg)}
@media(max-width:900px){.cols{grid-template-columns:1fr}.pane{max-height:none;min-height:0}}
.cols3{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) 280px;gap:12px;align-items:start}
.cols3 .pane,.cols .pane{min-width:0}
.rb{display:block;width:100%;text-align:left;margin:4px 0;padding:8px 10px;border-radius:8px;cursor:pointer;font:inherit;border:1px solid var(--bd)}
.rb.b{background:var(--pri);color:#fff;border-color:var(--pri)}.rb.g{background:none;color:var(--tx)}
.rb.on{background:#22c55e;color:#04210f;font-weight:600;border-color:#22c55e}.rb.off{background:#0b1f14;color:#bbf7d0;border-color:#166534}.instrimg img{display:block;width:100%;border:1px solid var(--bd);border-radius:8px;margin-bottom:8px}
.rb.ask{animation:pulse 1s infinite;outline:2px solid var(--mid)}
@keyframes pulse{50%{opacity:.55}}
.improw{margin-bottom:8px}
@media(max-width:1150px){.cols3{grid-template-columns:1fr 1fr}.cols3 .side{order:-1;grid-column:1/-1;max-height:none;min-height:0}}
@media(max-width:760px){.cols3{grid-template-columns:1fr}}

main.wide{max-width:none;padding:10px 14px 16px}
.pane{font-size:var(--fs,18px);line-height:1.55;max-height:calc(100vh - 210px);min-height:320px}

.pane .seg button,.pane .rb,.pane .b,.pane .g{font-size:.9em}
.pane .item{padding:12px 0}
.cols3{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(250px,.55fr)}
.cols{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
.tbar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:8px 14px;margin-bottom:8px}
.tbar .timer{font-size:34px;text-align:left;min-width:120px}
.tbar .warn{margin:0}
.fsb{display:inline-flex;gap:4px}
@media(max-width:1250px){.cols3{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.cols3,.cols{grid-template-columns:1fr}.pane{max-height:none}}
#vid{width:190px;cursor:default}#vid .ctl{cursor:move;touch-action:none}
#errbar{position:fixed;top:0;left:0;right:0;z-index:50;background:#b91c1c;color:#fff;padding:8px 12px;font-size:14px}
#errbar button{margin-left:8px;padding:3px 8px;border-radius:6px;border:1px solid #fff8;background:none;color:#fff;cursor:pointer}

<body>
<header><b>🩺 DuplaPEP</b><nav id="nav"></nav><button id="thm" class="g" style="margin-left:auto" title="Cambiar entre fondo blanco y negro">🌙</button><span id="st" class="small mut"></span><span class="small mut" id="ver"></span></header>
<main id="app"></main>
<div id="vid" class="hide"><video id="rv" autoplay playsinline></video><video id="lv" class="lv" autoplay muted playsinline></video><div class="ctl"><button onclick="tgl('audio')" id="bm">🎤</button><button onclick="tgl('video')" id="bc">📷</button><span id="vs">sin video</span></div></div>
<script src="peerjs.min.js"></script>
<script src="robusto.js"></script>
<script src="data.js"></script>
<script src="agent.js"></script>
<script>
const E=window.ESTACOES||[];
const $=(s,e=document)=>e.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS="rvp2_hist";
function loadH(){try{const a=JSON.parse(localStorage.getItem(LS));if(!Array.isArray(a))return[];return a.filter(x=>x&&typeof x==="object"&&typeof x.sid==="string"&&Number.isFinite(+x.t)&&Number.isFinite(+x.pct)).slice(-500).map(x=>({sid:x.sid,area:String(x.area||"").slice(0,80),edicao:String(x.edicao||"").slice(0,20),t:+x.t,role:String(x.role||"").slice(0,10),mode:x.mode==="room"?"room":"solo",total:+x.total||0,pct:Math.max(0,Math.min(100,+x.pct)),pep:(x.pep&&typeof x.pep==="object")?x.pep:{},hip:String(x.hip||"").slice(0,3000),notas:String(x.notas||"").slice(0,5000)}))}catch(e){dbg("historial corrupto, se ignora");return[]}}
let H=loadH();
const saveH=()=>{try{if(H.length>500)H=H.slice(-500);localStorage.setItem(LS,JSON.stringify(H))}catch(e){dbg("no se pudo guardar el historial: "+e.message)}};
const byId=id=>E.find(s=>s.id===id);
const maxPts=s=>s.itens.reduce((a,i)=>a+(i.pts.length?Math.max(...i.pts):0),0);
const ed=t=>t.replace("reap"," reaplic.");
let view="home",G=null,tab="",bf={q:"",ed:"",ar:"",guion:true};

/* ---------- navegación ---------- */
function nav(){const T={home:"Inicio",banco:"Banco",sala:G?"Sesión":"Sala",hist:"Historial",cfg:"⚙ Agente IA",diag:"🩺 Diagnóstico"};$("#nav").innerHTML=Object.entries(T).map(([k,v])=>`<button class="${view===k?"on":""}" onclick="go('${k}')">${v}</button>`).join("")}
function go(v){view=v;render()}
function keep(fn){const a=document.activeElement,id=a&&a.id,ss=a&&a.selectionStart,vals={},sc={},wy=window.scrollY;document.querySelectorAll("[data-keep]").forEach(e=>{if(e.id)sc[e.id]=e.scrollTop});document.querySelectorAll("#app textarea,#app input").forEach(e=>{if(e.id)vals[e.id]=e.value});fn();for(const k in vals){const e=document.getElementById(k);if(e&&e.value!==vals[k])e.value=vals[k]}for(const k in sc){const e=document.getElementById(k);if(e)e.scrollTop=sc[k]}window.scrollTo(0,wy);if(id){const e=document.getElementById(id);if(e){e.focus({preventScroll:true});try{e.setSelectionRange(ss,ss)}catch(x){}}}}
function render(){nav();$("#app").classList.toggle("wide",view==="sala"&&!!G&&G.role!=="?");$("#app").style.setProperty("--fs",FS+"px");keep(()=>{if(view==="home")home();else if(view==="banco")banco();else if(view==="sala")G?session():lobby();else if(view==="cfg")cfgPage();else if(view==="diag")diagPage();else hist()})}

/* ---------- inicio / banco ---------- */
function home(){$("#app").innerHTML=`<div class="card"><h2 style="margin-top:0">Entrenamiento 2ª etapa práctica Revalida</h2>
<p>${E.length} estaciones oficiales del INEP (ediciones 2021 reap. a 2025.2) con PEP, instrucciones e impresos. Todo corre en tu navegador.</p>
<div class="row"><button class="b" onclick="go('sala')">👥 Entrenar con compañera (actor / médico)</button><button class="g" onclick="solo()">🧍 Entrenar solo</button><button class="g" onclick="go('banco')">📚 Ver banco</button></div></div>
<div class="card small mut">Fuente: PDFs públicos del INEP. La extracción automática puede tener errores: si una estación marca ⚠, compara con el PEP original. El guion del paciente solo existe en las ediciones donde el INEP lo publicó (🎭).</div>`}
function stats(s){const h=H.filter(x=>x.sid===s.id);return h.length?`${h.length} int. · último ${h[h.length-1].pct}%`:"sin intentos"}
function banco(){const eds=[...new Set(E.map(s=>s.edicao))],ars=[...new Set(E.map(s=>s.area))];
 $("#app").innerHTML=`<div class="card row"><input class="grow" id="q" placeholder="Buscar..." value="${esc(bf.q)}" oninput="bf.q=this.value;fl()"><select id="fe" style="width:auto" onchange="bf.ed=this.value;fl()"><option value="">Todas las ediciones</option>${eds.map(e=>`<option ${bf.ed===e?"selected":""}>${e}</option>`).join("")}</select><select id="fa" style="width:auto" onchange="bf.ar=this.value;fl()"><option value="">Todas las áreas</option>${ars.map(e=>`<option ${bf.ar===e?"selected":""}>${e}</option>`).join("")}</select><label style="margin:0;white-space:nowrap"><input type="checkbox" style="width:auto" ${bf.guion?"checked":""} onchange="bf.guion=this.checked;fl()"> Solo con guion oficial del paciente 🎭 (${E.filter(s=>s.ator.length).length} de ${E.length})</label></div><div class="grid" id="list"></div>`;fl()}
const flt=()=>E.filter(s=>(!bf.guion||s.ator.length)&&(!bf.ed||s.edicao===bf.ed)&&(!bf.ar||s.area===bf.ar)&&(`${s.area} ${s.edicao} ${s.descricao}`).toLowerCase().includes(bf.q.toLowerCase()));
function fl(){$("#list").innerHTML=flt().map(s=>`<div class="card"><span class="tag">${esc(ed(s.edicao))} · E${s.n}</span> ${s.total!==10?'<span class="tag" title="Puntaje extraído ≠ 10">⚠</span>':""}${s.ator.length?'<span class="tag" title="Guion del paciente">🎭</span>':""}<h3 style="margin:8px 0">${esc(s.area)}</h3><div class="small mut">${s.itens.length} ítems · ${s.impressos.length} impresos · ${stats(s)}</div><div class="row" style="margin-top:10px"><button class="b" onclick="solo('${s.id}')">Solo</button><button class="g" onclick="roomWith('${s.id}')">Con compañera</button></div></div>`).join("")||"<p class='mut'>Nada.</p>"}
function pick(){const l=flt();return l.length?l[Math.random()*l.length|0].id:E[0].id}

/* ---------- estado de sesión ---------- */
const docRe=/(preench\w*|redig\w*|redij\w*|escrev\w*|elabor\w*)\s+(o\s+|a\s+|um\s+|uma\s+)?(documento|receitu\w+|atestado|declara\w+|encaminhamento|formul\w+|guia|laudo|notifica\w+)|receitu[aá]rio|por escrito/i;
const needsDoc=sid=>{const s=byId(sid);return !!s&&docRe.test(s.instrucoes)&&!/apenas de forma verbal|somente de forma verbal/i.test(s.instrucoes)||!!s&&s.itens.some(i=>/receitu[aá]rio|preenche/i.test(i.t))};
const newA=sid=>(TR=[],AI=null,{phase:"idle",left:600,dur:600,rel:{instr:false,imp:[]},pep:{},doc:needsDoc(sid||(G&&G.sid))});
const newD=()=>({reqs:[],notas:"",hip:"",conduta:"",doc:"",fin:false,flags:{}});
let tickT=null,deadline=0,saved=false;
function solo(id){id=id||pick();G={mode:"solo",role:"solo",sid:id,A:newA(id),D:newD()};saved=false;tab="";view="sala";startTick();render()}
function roomWith(id){bf.sel=id;go("sala")}
function lobby(){const sid=bf.sel||pick();
 $("#app").innerHTML=`<div class="card"><h3 style="margin-top:0">Crear sala</h3><div class="row"><div class="grow"><label>Mi rol</label><select id="rl"><option value="ator">Actor / evaluador (ve todo, libera información)</option><option value="medico">Médico (candidato)</option></select></div>
 <div class="grow"><label>Estación</label><select id="ss">${E.map(s=>`<option value="${s.id}" ${s.id===sid?"selected":""}>${esc(ed(s.edicao))} E${s.n} · ${esc(s.area)}${s.ator.length?" 🎭":""}</option>`).join("")}</select></div></div>
 <div style="margin-top:12px"><button class="b" onclick="host()">Crear sala</button></div></div>
 <div class="card"><h3 style="margin-top:0">Unirme a una sala</h3><div class="row"><input id="cd" value="${esc(bf.joinCode||"")}" placeholder="XXXXX-XXXXX" autocomplete="off" style="max-width:260px;text-transform:uppercase"><button class="b" onclick="join()">Unirme</button></div></div>
 <div class="card small mut">Se conectan directo entre navegadores (WebRTC, con servidor público solo para encontrarse). Permitan cámara y micrófono. Si el video no conecta por la red, hagan la llamada por WhatsApp/Meet: la sincronización de pantallas sigue funcionando.</div>`}

/* ---------- red ---------- */
let peer=null,conn=null,lstream=null;
const send=m=>{if(conn&&conn.open)conn.send(m)};
const pushA=()=>{if(G.mode==="room"&&G.role==="ator")send({t:"A",v:G.A})};
const pushD=()=>{if(G.mode==="room"&&G.role==="medico")send({t:"D",v:G.D})};
function status(t){$("#st").textContent=t}
async function media(){if(lstream)return lstream;try{lstream=await navigator.mediaDevices.getUserMedia({audio:true,video:{width:320,height:240}})}catch(e){dbg("cámara/mic no disponibles: "+(e&&e.name));const c=document.createElement("canvas");c.width=c.height=16;lstream=c.captureStream();$("#vs").textContent="sin cámara/mic"}$("#vid").classList.remove("hide");$("#lv").srcObject=lstream;return lstream}
function tgl(k){if(!lstream)return;const t=k==="audio"?lstream.getAudioTracks():lstream.getVideoTracks();t.forEach(x=>x.enabled=!x.enabled);$(k==="audio"?"#bm":"#bc").style.opacity=t[0]&&t[0].enabled?1:.4}
function onCall(c){c.on("stream",s=>{$("#rv").srcObject=s;$("#vid").classList.remove("hide");$("#vs").textContent="en llamada"})}
function wire(c){conn=c;c.on("open",()=>{status("🟢 conectada");dbg("conectada con la compañera");if(G.role==="ator"||G.host){send({t:"hello",role:G.role,sid:G.sid})}pushA();pushD();TR.forEach(x=>send({t:"T",v:x}));render()});
 c.on("data",m=>{if(!m||typeof m!=="object")return;
  if(m.t==="hello"){if(G.host||!["ator","medico"].includes(m.role)||!byId(m.sid))return;const nr=m.role==="ator"?"medico":"ator";if(G.role!==nr||G.sid!==m.sid){G.role=nr;G.sid=m.sid;G.A=newA(m.sid);G.D=newD();tab=""}startTick()}
  else if(m.t==="sid"){if(!byId(m.v))return;G.sid=m.v;G.A=newA(m.v);G.D=newD();saved=false}
  else if(m.t==="A"){if(G.role!=="medico")return;const prev=G.A.phase;G.A=cleanA(m.v);sync();if(G.A.phase==="done"&&prev!=="done")finishSave()}
  else if(m.t==="D"){if(G.role!=="ator")return;G.D=cleanD(m.v);if(!(tab==="med"||G.A.phase==="eval"||G.A.phase==="done"))return}
  else if(m.t==="T"){const t=cleanT(m.v);if(t&&t.id&&!TR.some(x=>x.id===t.id)){TR.push(t);if(TR.length>800)TR.shift();TR.sort((p,q)=>p.t-q.t)}if(tab!=="tr"||view!=="sala")return}
  else return;
  render()});
 c.on("close",()=>{status("🔴 compañera desconectada");dbg("conexión cerrada");render()});c.on("error",e=>{dbg("error de conexión: "+(e&&e.type));status("error de conexión")})}
const PH=["idle","run","paused","eval","done"],num=(x,lo,hi,d)=>Number.isFinite(+x)?Math.min(hi,Math.max(lo,+x)):d,SS=(x,n)=>String(x==null?"":x).slice(0,n);
function cleanA(v){v=v&&typeof v==="object"?v:{};const s=byId(G.sid),n=s?s.itens.length:0,ni=s?s.impressos.length:0;
 const imp=(Array.isArray(v.rel&&v.rel.imp)?v.rel.imp:[]).map(Number).filter(x=>Number.isInteger(x)&&x>=0&&x<ni);
 const pep={};for(const k in (v.pep||{})){const i=+k,m=+v.pep[k];if(Number.isInteger(i)&&i>=0&&i<n&&(m===0||m===1||m===2))pep[i]=m}
 const man={};for(const k in (v.man||{}))if(Number.isInteger(+k)&&+k>=0&&+k<n)man[+k]=1;
 let ai=null;if(v.ai&&v.ai.res&&typeof v.ai.res==="object"){const res={};for(const k in v.ai.res){const i=+k,r=v.ai.res[k];if(Number.isInteger(i)&&i>=0&&i<n&&r)res[i]={k:num(r.k,0,2,0)|0,evid:SS(r.evid,600),cuenta:SS(r.cuenta,400),faltou:SS(r.faltou,400),duvida:!!r.duvida}}ai={res,resumen:SS(v.ai.resumen,1500),final:!!v.ai.final}}
 return{phase:PH.includes(v.phase)?v.phase:"idle",left:num(v.left,0,7200,600),dur:num(v.dur,60,7200,600),rel:{instr:!!(v.rel&&v.rel.instr),imp},pep,man,doc:!!v.doc,ai}}
function cleanD(v){v=v&&typeof v==="object"?v:{};const n=(byId(G.sid)||{itens:[]}).itens.length,flags={};

function hist(){if(!H.length){$("#app").innerHTML=`<div class="card mut">Sin sesiones aún.</div>`;return}
 const by={};H.forEach(x=>(by[x.area]=by[x.area]||[]).push(x.pct));const avg=a=>Math.round(a.reduce((x,y)=>x+y,0)/a.length);
 const miss={};H.forEach(x=>{const s=byId(x.sid);if(!s)return;s.itens.forEach((it,i)=>{const k=x.pep[i];const mx=it.pts.length?Math.max(...it.pts):0;const got=k==null?0:(it.pts[k]??0);if(got<mx)miss[x.sid+"|"+i]=(miss[x.sid+"|"+i]||0)+(mx-got)})});
 const worst=Object.entries(miss).sort((a,b)=>b[1]-a[1]).slice(0,10);const pts=H.map(x=>x.pct),W=600,Hh=120,pp=pts.map((p,i)=>`${pts.length>1?i*W/(pts.length-1):W/2},${Hh-p*Hh/100}`).join(" ");
 $("#app").innerHTML=`<div class="card"><h3 style="margin-top:0">Evolución (${H.length} sesiones · media ${avg(pts)}%)</h3><svg viewBox="0 -5 ${W} ${Hh+10}" width="100%"><line x1="0" x2="${W}" y1="${Hh*.4}" y2="${Hh*.4}" stroke="var(--bd)" stroke-dasharray="4"/><polyline fill="none" stroke="var(--pri)" stroke-width="2.5" points="${pp}"/></svg><div class="small mut">Línea punteada = 60%</div></div>
 <div class="card"><h3 style="margin-top:0">Por área</h3>${Object.entries(by).map(([a,v])=>`<div style="margin:8px 0"><div class="row"><span class="grow">${esc(a)} <span class="mut">(${v.length})</span></span><b>${avg(v)}%</b></div><div class="bar"><i style="width:${avg(v)}%"></i></div></div>`).join("")}</div>
 <div class="card"><h3 style="margin-top:0">Ítems que más pierdes</h3>${worst.length?`<ol>${worst.map(([k,v])=>{const [id,i]=k.split("|"),s=byId(id);return `<li class="small">${esc(ed(s.edicao))} E${s.n} (${esc(s.area)}): ${esc(s.itens[i].t)}</li>`}).join("")}</ol>`:"<span class='mut'>Nada aún.</span>"}</div>
 <div class="card"><h3 style="margin-top:0">Sesiones</h3>${[...H].reverse().map(x=>`<div class="item row"><div class="grow small"><b>${esc(ed(x.edicao))} · ${esc(x.area)}</b> <span class="mut">${new Date(x.t).toLocaleString()} · ${x.mode==="room"?"con compañera ("+x.role+")":"solo"}</span></div><b>${x.pct}%</b></div>`).join("")}</div>
 <div class="row"><button class="g" onclick="exp()">⬇ Exportar respaldo</button><button class="g" onclick="$('#imp').click()">⬆ Importar</button><input id="imp" type="file" accept=".json" class="hide" onchange="imp(event)"></div>`}
function exp(){const a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify(H)],{type:"application/json"}));a.href=u;a.download="duplapep-historial.json";a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}
function imp(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result),ts=new Set(H.map(x=>x.t));d.forEach(x=>{if(!ts.has(x.t))H.push(x)});H.sort((a,b)=>a.t-b.t);saveH();render()}catch(x){alert("Archivo inválido")}};r.readAsText(f)}
try{$("#ver").textContent="v"+VERSION}catch(e){}
(function(){const m=location.hash.match(/^#sala=([A-Za-z0-9]+)/);if(m){bf.joinCode=m[1];view="sala";window.__auto=true;history.replaceState(null,"",location.pathname)}})();
render();
if(window.__auto)setTimeout(()=>join(),300);
</script>
</body>
</html>
